; Strategy Tester, jalur satu klik lewat run_backtest.bat.
;
; SATU SEL SAJA. Untuk matriks (tiga detektor lawan dua instrumen lawan lima
; timeframe, dengan input tercatat dan report tersimpan per sel), pakai
;
;     cd backend
;     PYTHONPATH=. .venv/Scripts/python.exe -m tools.mt5_backtest > ../docs/mt5-backtest.json
;
; APA YANG SALAH DI FILE INI SEBELUM 1 September 2026, karena dua-duanya
; menyesatkan pembaca yang mempercayainya:
;   - Expert-nya menunjuk ZonelabFVG, sisa run sapuan terakhir, padahal
;     README dan run_backtest.bat sama-sama bilang file ini menjalankan
;     ZonelabSD. Siapa pun yang dobel-klik mengukur detektor yang lain.
;   - Tidak ada satu baris input pun, di kelima revisinya. MT5 lalu memakai
;     compiled default, yang berarti setiap angka non-default di README
;     (gate 4,0, target 0,5R dan 1R, SMA 100 dan 200, OB 2,5 ATR) di-set di
;     GUI dan tidak tersimpan di mana pun. ExpertParameters di bawah menutup
;     itu: input yang dipakai adalah input yang tertulis di .set.
;
; Model: 0 = every tick, 1 = 1 minute OHLC, 2 = open prices, 4 = real ticks.
[Tester]
Expert=ZonelabSupplyDemand\ZonelabSD
ExpertParameters=zonelab_ZonelabSD.set
Symbol=XAUUSD
Period=H1
Model=4
FromDate=2026.01.01
ToDate=2026.08.31
ForwardMode=0
Deposit=10000
Currency=USD
ProfitInPips=0
Leverage=100
ExecutionMode=0
Optimization=0
OptimizationCriterion=6
Report=ZonelabSD_XAUUSD_H1_oneclick
ReplaceReport=1
ShutdownTerminal=0
